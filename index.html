<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Battle ⚔️ Калькулятор</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --accent-color: #2563eb;
      --border-color: #cbd5e1;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --panel-bg: #f8fafc;
      --count-color: #2563eb;

      /* Zebra Colors (Light Mode) */
      --tier-even-bg: #f1f5f9;
      --tier-odd-bg: transparent;
      --row-border-color: #e2e8f0;
      --tier-separator-color: #cbd5e1;
      --big-num-color: rgba(30, 41, 59, 0.15);
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --panel-bg: #0f172a;
      --count-color: #60a5fa;

      /* Zebra Colors (Dark Mode) */
      --tier-even-bg: rgba(255, 255, 255, 0.035);
      --tier-odd-bg: transparent;
      --row-border-color: #334155;
      --tier-separator-color: #475569;
      --big-num-color: rgba(248, 250, 252, 0.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    .calculator-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: relative;
      transition: background-color 0.3s;
    }

    /* Top Header Title */
    .header-title-main {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 14px;
    }

    /* Mode & Theme Selector Bar */
    .top-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--panel-bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .mode-switch-group {
      display: flex;
      flex: 1;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--card-bg);
      color: var(--accent-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .theme-toggle-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover {
      background: var(--card-bg);
    }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--panel-bg);
      padding: 10px 6px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      transition: opacity 0.2s;
    }

    .control-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .control-input {
      width: 80%;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px;
      background: var(--input-bg);
      color: var(--text-main);
    }

    .control-input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .control-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--panel-bg);
    }

    .read-only-val {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 5px 0;
      color: #10b981;
    }

    /* Reset Button */
    .reset-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }

    .reset-btn:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    /* Guard Tiers Section */
    .tier-group-row {
      background: var(--panel-bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .tier-group-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tiers-strip-horizontal {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
    }

    .tier-item-inline {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tier-num-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .tier-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    /* Section Label */
    .section-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-align: center;
    }

    /* Output Ladder Table */
    .ladder-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .ladder-row td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--row-border-color);
    }

    /* Big Background Tier Number Cell */
    .tier-number-cell {
      width: 45px;
      text-align: center;
      vertical-align: middle;
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--big-num-color);
      user-select: none;
      padding: 0 4px !important;
      line-height: 0.9;
    }

    /* Separator Line Between Tiers */
    .tier-start-row td {
      border-top: 2px solid var(--tier-separator-color);
    }

    .ladder-table tbody tr:first-child td {
      border-top: none;
    }

    /* Zebra Tint */
    .row-tier-even {
      background-color: var(--tier-even-bg);
    }

    .row-tier-odd {
      background-color: var(--tier-odd-bg);
    }

    .unit-type-cell {
      text-align: right;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-main);
      padding-right: 12px !important;
    }

    .unit-count-cell {
      width: 45%;
      text-align: left;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--count-color);
    }

    /* Footer Branding */
    .footer-branding {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .footer-img {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-bottom: 6px;
    }

    .footer-caption {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .footer-version {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    
    <!-- Top Header Title -->
    <div class="header-title-main">Total Battle ⚔️ Калькулятор</div>

    <!-- Mode & Theme Switcher Bar -->
    <div class="top-toolbar">
      <div class="mode-switch-group">
        <button id="btnSimple" class="mode-btn active">Простой</button>
        <button id="btnAdvanced" class="mode-btn">Эффективный</button>
      </div>
      <button id="themeToggleBtn" class="theme-toggle-btn" title="Переключить тему">☀️</button>
    </div>

    <!-- Controls Row -->
    <div class="controls-grid">
      <div class="control-item">
        <span class="control-label">Лидерство</span>
        <input type="number" id="leadershipInput" class="control-input" value="1800" min="0" step="10">
      </div>
      <div class="control-item">
        <span class="control-label">Остаток</span>
        <span id="remainderVal" class="read-only-val">0</span>
      </div>
      <div class="control-item">
        <span class="control-label">Округлить</span>
        <select id="roundSelect" class="control-input">
          <option value="none">Нет</option>
          <option value="10">10</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <!-- Reset Button -->
    <div class="reset-container">
      <button id="resetBtn" class="reset-btn">🔄 Сбросить</button>
    </div>

    <!-- Guard Tiers Panel -->
    <div class="tier-group-row">
      <div class="tier-group-title">Гвардия</div>
      <div class="tiers-strip-horizontal">
        <div class="tier-item-inline"><span class="tier-num-label">1</span><input type="checkbox" class="tier-checkbox guard-cb" data-tier="1" checked></div>
        <div class="tier-item-inline"><span class="tier-num-label">2</span><input type="checkbox" class="tier-checkbox guard-cb" data-tier="2" checked></div>
        <div class="tier-item-inline"><span class="tier-num-label">3</span><input type="checkbox" class="tier-checkbox guard-cb" data-tier="3"></div>
        <div class="tier-item-inline"><span class="tier-num-label">4</span><input type="checkbox" class="tier-checkbox guard-cb" data-tier="4"></div>
        <div class="tier-item-inline"><span class="tier-num-label">5</span><input type="checkbox" class="tier-checkbox guard-cb" data-tier="5"></div>
      </div>
    </div>

    <!-- Ladder Result -->
    <div class="section-label">Итоговая лесенка:</div>
    <table class="ladder-table">
      <tbody id="ladderBody">
        <!-- Dynamic Rows -->
      </tbody>
    </table>

    <!-- Footer Branding -->
    <div class="footer-branding">
      <img src="cat.jpg" alt="Gray Cat" class="footer-img" id="footerImg">
      <span class="footer-caption">Gray Cat In Black Hoodie</span>
      <span class="footer-version">simple ladder calculator v.4.1</span>
    </div>

  </div>

  <script>
    const guardUnits = [
      { name: 'Всадник 🐴', mult: 1, cost: 2 },
      { name: 'Лучник 🏹', mult: 2, cost: 1 },
      { name: 'Копейщик 🔱', mult: 2, cost: 1 }
    ];

    const leadershipInput = document.getElementById('leadershipInput');
    const remainderVal = document.getElementById('remainderVal');
    const roundSelect = document.getElementById('roundSelect');
    const guardCheckboxes = document.querySelectorAll('.guard-cb');
    const ladderBody = document.getElementById('ladderBody');
    const resetBtn = document.getElementById('resetBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    
    const btnSimple = document.getElementById('btnSimple');
    const btnAdvanced = document.getElementById('btnAdvanced');

    let calcMode = 'simple'; // 'simple' (2.0) or 'advanced' (1.83)

    // Mode Buttons Listeners
    btnSimple.addEventListener('click', () => {
      if (calcMode !== 'simple') {
        calcMode = 'simple';
        btnSimple.classList.add('active');
        btnAdvanced.classList.remove('active');
        roundSelect.disabled = false;
        calculate();
      }
    });

    btnAdvanced.addEventListener('click', () => {
      if (calcMode !== 'advanced') {
        calcMode = 'advanced';
        btnAdvanced.classList.add('active');
        btnSimple.classList.remove('active');
        roundSelect.value = 'none'; // reset round in advanced mode
        roundSelect.disabled = true;  // disable selector
        calculate();
      }
    });

    // Theme Logic
    const savedTheme = localStorage.getItem('tb_calc_theme') || 'light';
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggleBtn.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        themeToggleBtn.textContent = '☀️';
        localStorage.setItem('tb_calc_theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggleBtn.textContent = '🌙';
        localStorage.setItem('tb_calc_theme', 'dark');
      }
    });

    function calculate() {
      const L = parseFloat(leadershipInput.value) || 0;
      const roundMode = roundSelect.value;

      const activeTiers = [];
      guardCheckboxes.forEach(cb => {
        if (cb.checked) activeTiers.push(parseInt(cb.dataset.tier));
      });

      if (activeTiers.length === 0 || L === 0) {
        remainderVal.textContent = L.toLocaleString('ru-RU');
        ladderBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:15px; color:var(--text-muted); font-size:0.85rem;">Укажите лидерство и выберите уровни гвардии</td></tr>';
        return;
      }

      const K1 = Math.max(...activeTiers); // Highest Tier
      const ratio = (calcMode === 'advanced') ? 1.83 : 2.0;

      // Calculate Block Cost K2
      let K2 = 0;
      activeTiers.forEach(t => {
        K2 += 6 * Math.pow(ratio, K1 - t);
      });

      // Calculate Base X (K3)
      let K3 = 0;
      if (K2 > 0) {
        const rawX = L / K2;
        if (roundMode === '10' && calcMode === 'simple') {
          K3 = Math.floor(rawX / 10) * 10;
        } else if (roundMode === '100' && calcMode === 'simple') {
          K3 = Math.floor(rawX / 100) * 100;
        } else {
          K3 = Math.floor(rawX);
        }
      }

      let totalUsedLeadership = 0;
      let htmlRows = '';

      // Output Ladder (T5 down to T1)
      for (let t = 5; t >= 1; t--) {
        if (!activeTiers.includes(t)) continue;

        const tierClass = (t % 2 === 0) ? 'row-tier-even' : 'row-tier-odd';
        const totalRowsInTier = guardUnits.length; // 3 rows

        guardUnits.forEach((unit, idx) => {
          const count = Math.floor(K3 * unit.mult * Math.pow(ratio, K1 - t));
          const leadCost = count * unit.cost;
          totalUsedLeadership += leadCost;

          const isFirstRowOfTier = (idx === 0);
          const borderClass = isFirstRowOfTier ? 'tier-start-row' : '';

          htmlRows += `<tr class="ladder-row ${tierClass} ${borderClass}">`;

          if (isFirstRowOfTier) {
            htmlRows += `<td class="tier-number-cell" rowspan="${totalRowsInTier}">${t}</td>`;
          }

          htmlRows += `
              <td class="unit-type-cell">${unit.name}</td>
              <td class="unit-count-cell">${count.toLocaleString('ru-RU')}</td>
            </tr>
          `;
        });
      }

      const remainder = L - totalUsedLeadership;
      remainderVal.textContent = remainder.toLocaleString('ru-RU');
      ladderBody.innerHTML = htmlRows;
    }

    // Reset Action
    resetBtn.addEventListener('click', () => {
      leadershipInput.value = 0;
      roundSelect.value = 'none';
      if (calcMode === 'simple') {
        roundSelect.disabled = false;
      }
      guardCheckboxes.forEach(cb => cb.checked = false);
      calculate();
    });

    leadershipInput.addEventListener('input', calculate);
    roundSelect.addEventListener('change', calculate);
    guardCheckboxes.forEach(cb => cb.addEventListener('change', calculate));

    // Initial Run
    calculate();
  </script>
</body>
</html>
